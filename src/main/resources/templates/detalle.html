<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Detalle de Trip</title>

<link th:href="@{/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <h1 class="text-center">Detalle del Trip</h1>
    <hr>

    <!-- VALIDACIÓN -->
    <div th:if="${trip != null}">

        <h3>
            <strong>Nombre:</strong>
            <span th:text="${trip.nomTrip}"></span>
        </h3>

        <h3>
            <strong>Fecha de publicación:</strong>
            <span th:text="${#dates.format(trip.fecha, 'dd-MM-yyyy')}"></span>
        </h3>

        <h3>
            <strong>Costo:</strong>
            $<span th:text="${trip.costo}"></span>
        </h3>

        <h3>
            <strong>Descripción:</strong>
            <span th:text="${trip.descripcion}"></span>
        </h3>

        <!-- IMAGEN -->
        <div class="mt-3">
            <img th:src="@{'/images/' + ${trip.imagen}}"
                 class="img-fluid rounded"
                 width="300">
        </div>

    </div>

    <!-- SI NO EXISTE -->
    <div th:if="${trip == null}">
        <h3 class="text-danger">No se encontró el trip</h3>
    </div>

    <!-- BOTÓN VOLVER -->
    <a href="/" class="btn btn-primary mt-4">Volver al inicio</a>

</div>

</body>
</html>
