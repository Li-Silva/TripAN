<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Trip | Aplicación para publicar Ofertas en El Salvador</title>

<!-- CSS -->
<link th:href="@{/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
<link th:href="@{/bootstrap/css/jumbotron.css}" rel="stylesheet">
<link th:href="@{/bootstrap/css/sticky-footer-navbar.css}" rel="stylesheet">
</head>

<body>

<!-- NAVBAR -->
<header>
<nav class="navbar navbar-expand-md navbar-dark fixed-top bg-dark">
    <a class="navbar-brand" href="#">TripAnApplication</a>

    <button class="navbar-toggler" type="button"
            data-toggle="collapse"
            data-target="#navbarContent">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarContent">
        <ul class="navbar-nav mr-auto">
            <li class="nav-item">
                <a class="nav-link active" href="/">Inicio</a>
            </li>
        </ul>
    </div>
</nav>
</header>

<main role="main">

    <!-- 🔥 JUMBOTRON (LO QUE TE FALTABA) -->
    <div class="jumbotron">
        <div class="container">
            <h1 class="display-5">Encuentra los mejores Trips en El Salvador.</h1>
            <p>Puedes buscar por descripción y categoría.</p>

            <!-- BUSCADOR -->
            <form class="form-inline">
                <input class="form-control mr-sm-2" type="search" placeholder="Escriba una búsqueda">
                
                <select class="form-control mr-sm-2">
                    <option>Todas las categorías</option>
                    <option>Aventura</option>
                    <option>Ciudad</option>
                    <option>Naturaleza</option>
                </select>

                <button class="btn btn-primary" type="submit">Buscar</button>
            </form>
        </div>
    </div>

    <!-- CONTENIDO -->
    <div class="container">

        <h2 class="text-center font-weight-bold">TRIPS DESTACADOS</h2>
        <hr>

        <!-- LISTA DINÁMICA -->
        <div th:each="t : ${trips}" class="row mb-4">

            <!-- IMAGEN -->
            <div class="col-md-3">
                <img th:src="@{'/images/' + ${t.imagen}}"
                     class="img-fluid rounded">
            </div>

            <!-- INFO -->
            <div class="col-md-9">
                <h3 th:text="${t.nomTrip}"></h3>

                <p><strong>Categoría:</strong> Aventura</p>

                <p>
                    <strong>Publicado:</strong>
                    <span th:text="${#dates.format(t.fecha, 'dd-MM-yyyy')}"></span>
                </p>

                <p th:text="${t.descripcion}"></p>

                <a class="btn btn-secondary"
                   th:href="@{'/detalle/' + ${t.id}}">
                    Ver detalles »
                </a>
            </div>

        </div>

    </div>

</main>

<!-- JS -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script th:src="@{/bootstrap/js/bootstrap.min.js}"></script>

</body>
</html>
