<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Roles</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

<div class="container mt-4">
    <img alt="logo" th:src="@{/images/logo.png}" width="130" height="100">
    
    <h1>Roles</h1>

    <table class="table table-hover table-striped">
        
        <thead>
            <tr>
                <th>Imagen</th>
                <th>Id</th>
                <th>Nombre</th>
                <th>Fecha publicación</th>
                <th>Descripción</th>
                <th>Detalle</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="rol : ${listadorol}">
                
                <td>

                    <img alt="" th:src="@{/images/{img}(img=${trip.imagen})}" width="100" height="100">
                </td>

                <td th:text="${rol.id}"></td>
                <td th:text="${rol.nomRol}"></td>
                <td th:text="${#dates.format(rol.fecha, 'dd/MM/yyyy')}"></td>
                <td th:text="${rol.descripcion}"></td>


                <td>
                    <a th:href="@{/rol/view/{id}(id=${rol.id})}" 
                       class="btn btn-success" >Detalle</a>
                </td>
                
                <td>
                    <a th:href="@{/rol/delete(id=${rol.id})}" 
                       class="btn btn-danger" >Eliminar</a>
                </td>

            </tr>
        </tbody>

    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
