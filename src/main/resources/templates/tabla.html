<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Trips</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

<div class="container mt-4">
    <h1>Trips en El Salvador</h1>

    <table class="table table-hover table-striped">
        
        <thead>
            <tr>
                <th>Id</th>
                <th>Nombre</th>
                <th>Fecha publicación</th>
                <th>Costo</th>
                <th>Descripción</th>
                <th>Destacado</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="trip : ${listadoTrips}">
                <td th:text="${trip.id}"></td>
                <td th:text="${trip.nomTrip}"></td>

                <!-- Fecha formateada -->
                <td th:text="${#dates.format(trip.fecha, 'dd/MM/yyyy')}"></td>

                <!-- Costo formateado -->
                <td th:text="${#numbers.formatDecimal(trip.costo, 1, 2)}"></td>

                <td th:text="${trip.descripcion}"></td>

                <!-- ✅ Destacado con badge -->
                <td>
                    <span th:if="${trip.destacado == 1}" class="badge bg-success">Sí</span>
                    <span th:unless="${trip.destacado == 1}" class="badge bg-danger">No</span>
                </td>

            </tr>
        </tbody>

    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
