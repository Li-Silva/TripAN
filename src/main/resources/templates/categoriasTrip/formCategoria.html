<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>TripApp | Gestión de Categorías</title>

    <!-- Bootstrap CSS -->
    <link th:href="@{/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/bootstrap/css/jumbotron.css}" rel="stylesheet">
    <link th:href="@{/bootstrap/css/sticky-footer-navbar.css}" rel="stylesheet">
</head>

<body>

<header>
    <nav class="navbar navbar-expand-md navbar-dark fixed-top bg-dark">

        <!-- LOGO -->
        <a class="navbar-brand" th:href="@{/}">TripApp</a>

        <!-- BOTON RESPONSIVE -->
        <button class="navbar-toggler" type="button"
                data-toggle="collapse"
                data-target="#navbarPrincipal"
                aria-controls="navbarPrincipal"
                aria-expanded="false"
                aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- MENUS -->
        <div class="collapse navbar-collapse" id="navbarPrincipal">

            <ul class="navbar-nav mr-auto">

                <li class="nav-item active">
                    <a class="nav-link" th:href="@{/}">
                        Inicio
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/categorias}">
                        Categorías
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/ofertas}">
                        Ofertas
                    </a>
                </li>

            </ul>

            <!-- BOTONES -->
            <a class="btn btn-primary mr-2" th:href="@{/login}">
                Ingresar
            </a>

            <a class="btn btn-success" th:href="@{/register}">
                Registrarse
            </a>

        </div>
    </nav>
</header>

<!-- CONTENIDO -->
<main role="main" class="container mt-5 pt-5">

    <!-- MENSAJE EXITOSO -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">

        <span th:text="${success}"></span>

        <button type="button" class="close" data-dismiss="alert">
            <span>&times;</span>
        </button>
    </div>

    <!-- TARJETA -->
    <div class="card shadow">

        <!-- TITULO -->
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">
                Datos de la Categoría
            </h4>
        </div>

        <!-- CUERPO -->
        <div class="card-body">

            <!-- FORMULARIO -->
            <form th:action="@{/categorias/save}"
                  th:object="${categoria}"
                  method="post">

                <!-- NOMBRE -->
                <div class="form-group">

                    <label for="nombre">
                        Nombre
                    </label>

                    <input type="text"
                           class="form-control"
                           id="nombre"
                           th:field="*{nombre}"
                           placeholder="Escriba el nombre de la categoría"
                           required>

                    <!-- ERROR -->
                    <small class="text-danger"
                           th:if="${#fields.hasErrors('nombre')}"
                           th:errors="*{nombre}">
                    </small>
                </div>

                <!-- DESCRIPCION -->
                <div class="form-group">

                    <label for="descripcion">
                        Descripción
                    </label>

                    <textarea class="form-control"
                              id="descripcion"
                              th:field="*{descripcion}"
                              rows="3"
                              placeholder="Escriba una descripción">
                    </textarea>

                    <!-- ERROR -->
                    <small class="text-danger"
                           th:if="${#fields.hasErrors('descripcion')}"
                           th:errors="*{descripcion}">
                    </small>

                </div>

                <hr>

                <!-- BOTONES -->
                <button type="submit"
                        class="btn btn-primary">

                    Guardar
                </button>

                <a th:href="@{/categorias}"
                   class="btn btn-secondary">

                    Cancelar
                </a>

            </form>

        </div>
    </div>

</main>

<!-- FOOTER -->
<footer class="footer bg-dark text-white mt-5">

    <div class="container py-3">

        <p class="mb-0 text-center">
            &copy; 2026 TripApp |
            Sistema desarrollado con Spring Boot y Thymeleaf
        </p>

    </div>

</footer>

<!-- JS -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>

<script th:src="@{/bootstrap/js/bootstrap.min.js}"></script>

</body>
</html>
